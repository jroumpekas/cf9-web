<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="/Άσκηση 3 - AADE/aade.css" />
</head>

<body>
  <div class="page">
    <div class="card">

      <header class="top-logos">
        <img src="../img/LOGO_GGPS_new1.png" alt="GGPS" />
        <img src="../img/logo_el2.png" alt="Ελληνική Δημοκρατία" />
      </header>

      <h1 class="main-header">Αυθεντικοποίηση Χρήστη</h1>

      <div class="content">
        <h2 class="second-header">Σύνδεση</h2>

        <p class="info">
          Παρακαλώ εισάγετε τους κωδικούς σας στο <strong>TaxisNet</strong> για να συνδεθείτε.
        </p>

        <div class="divider"></div>

        <form class="dimosia-dioikisi" action="">
          <div class="form-group">
            <label for="user">Χρήστης:</label>
            <input type="text" id="user" class="item-large no-outline" />
          </div>

          <div class="form-group">
            <label for="password">Κωδικός:</label>
            <input type="password" id="password" class="item-large no-outline" />
          </div>

          <input
            type="submit"
            id="submit"
            class="item-large color-bluelight text-white rounded no-border"
            value="Σύνδεση"
          />
        </form>
      </div>

      <footer>
        <div class="full-width align-center">
          <a href="https://gsis.gr/dimosia-dioikisi/ked">
            Κέντρο Διαλειτουργικότητας (ΚΕΔ) Υπουργείου Ψηφιακής Διακυβέρνησης
          </a>
        </div>
      </footer>

    </div>
  </div>
</body>
</html>
